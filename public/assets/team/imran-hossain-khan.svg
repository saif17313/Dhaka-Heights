  <line x1="292" x2="508" y1="462" y2="462" stroke="#C5A880" stroke-width="4"/>
  <text x="400" y="930" text-anchor="middle" fill="#C5A880" font-family="Arial, sans-serif" font-size="25" letter-spacing="8">DHAKA HEIGHTS</text>
