<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Imran Hossain Khan profile placeholder</title>
  <desc id="desc">A Dhaka Heights branded monogram portrait placeholder that can be replaced from the admin panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B3D"/>
      <stop offset="0.58" stop-color="#142A57"/>
      <stop offset="1" stop-color="#08142E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#C5A880" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#C5A880" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
